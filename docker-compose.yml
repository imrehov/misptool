services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-misptool}
      POSTGRES_USER: ${POSTGRES_USER:-misptool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-misptool_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    restart: unless-stopped
    command: uvicorn src.misptool.api.app:app --host 0.0.0.0 --port 8000
    environment:
      MISP_DB_URL: ${MISP_DB_URL:-postgresql+psycopg://misptool:misptool_password@postgres:5432/misptool}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
    restart: unless-stopped
    command: python main.py --config config.yaml run
    environment:
      MISP_DB_URL: ${MISP_DB_URL:-postgresql+psycopg://misptool:misptool_password@postgres:5432/misptool}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  postgres_data:
